<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AegisMesh 天穹韌網 · 通訊韌性戰情室</title>
<!-- 內嵌 favicon：避免瀏覽器對 /favicon.ico 發出 404 請求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e13'/%3E%3Cpath d='M16 5l9 4v7c0 6-4 9.5-9 11-5-1.5-9-5-9-11V9z' fill='none' stroke='%234dd0e1' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · genre: modern-minimal · macrostructure: Workbench · tone: technical · anchor hue: cyan
 * contrast: pass (40-41) · honest: pass (46) · chrome: pass (47) · tokens: pass (48)
 * responsive: pass (34, 49-57) · icons: pass (30)
 */
:root{
  --bg:oklch(13% .012 235); --panel:oklch(16% .014 235); --panel-2:oklch(19% .016 235); --line:oklch(29% .018 235);
  --fg:oklch(94% .008 235); --muted:oklch(76% .018 235); --dim:oklch(58% .025 235);
  --ok:oklch(78% .17 150); --warn:oklch(82% .15 78); --crit:oklch(70% .19 28); --accent:oklch(78% .13 210);
  --fiber:var(--ok); --g5:var(--warn); --sat:oklch(74% .13 250); --wire:oklch(38% .025 235);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font-size:14px;
  font-family:var(--font-body,"Noto Sans TC",sans-serif);
  display:flex; flex-direction:column; overflow:hidden;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:16px; padding:12px 20px;
  border-bottom:1px solid var(--line); background:var(--panel-2); flex:none;
}
.brand{font-size:16px; font-weight:650; letter-spacing:.02em}
.brand small{color:var(--muted); font-weight:400; margin-left:8px; letter-spacing:0}
.spacer{flex:1}
.badge{
  font-size:11px; padding:4px 9px; border-radius:5px; border:1px solid var(--line);
  color:var(--muted); background:var(--panel); white-space:nowrap;
}
.badge.on{color:var(--ok); border-color:color-mix(in oklch,var(--ok) 38%,var(--line))}
.badge.off{color:var(--warn); border-color:color-mix(in oklch,var(--warn) 36%,var(--line))}
select,button{
  font:inherit; color:var(--fg); background:var(--panel-2);
  border:1px solid var(--line); border-radius:6px; padding:7px 12px;
}
button{cursor:pointer; transition:background-color var(--dur-short,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),border-color var(--dur-short,160ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),transform 100ms var(--ease-out,cubic-bezier(.16,1,.3,1))}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4; cursor:not-allowed}
select:disabled{opacity:.55; cursor:not-allowed}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600}
button.go{background:var(--ok); border-color:var(--ok); color:var(--bg)}
button.no{background:transparent; border-color:var(--crit); color:var(--crit)}

/* ---------- layout ---------- */
main{flex:1; display:grid; grid-template-columns:1fr 380px; gap:1px;
     background:var(--line); min-height:0}
.col{display:flex; flex-direction:column; gap:1px; min-height:0; background:var(--line)}
.panel{background:var(--panel); padding:14px 16px; min-height:0; overflow:auto}
.panel.tight{padding:0}
h2{
  margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
}
h2 .hint{float:right; text-transform:none; letter-spacing:0; font-weight:400; color:var(--dim)}

/* ---------- topology ---------- */
#topo{width:100%; height:auto; display:block}
.link{stroke:var(--wire); stroke-width:2; transition:stroke var(--dur-medium,280ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),stroke-width var(--dur-medium,280ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.link.fiber{stroke:var(--fiber)} .link.g5{stroke:var(--g5)} .link.sat{stroke:var(--sat)}
.link.degraded{stroke:var(--warn); stroke-dasharray:7 5; animation:flow 1s linear infinite}
.link.down{stroke:var(--crit); stroke-dasharray:3 6; opacity:.55}
@keyframes flow{to{stroke-dashoffset:-12}}
.nodebox{fill:var(--panel-2); stroke:var(--line); rx:6}
.nodebox.dc{fill:var(--panel-2); stroke:var(--accent)}
.nodelbl{fill:var(--fg); font-size:10.5px}
.nodesub{fill:var(--dim); font-size:9px; font-family:var(--mono)}
.linklbl{fill:var(--dim); font-size:8.5px; font-family:var(--mono)}

/* ---------- metric tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px}
.tile{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:11px 12px}
.tile .k{font-size:10px; color:var(--muted); letter-spacing:.05em}
.tile .v{font-family:var(--mono); font-size:25px; font-weight:600; margin-top:3px; line-height:1.1}
.tile .d{font-size:10px; color:var(--dim); font-family:var(--mono); margin-top:2px}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.crit{color:var(--crit)}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:12px}
th{
  text-align:left; font-weight:500; color:var(--muted); font-size:10px;
  letter-spacing:.05em; padding:5px 7px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--panel);
}
td{padding:6px 7px; border-bottom:1px solid var(--line)}
tr.sel td{background:var(--panel-2)}
.r{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.pri{
  font-family:var(--mono); font-size:10px; padding:1px 5px; border-radius:3px;
  background:var(--panel-2); color:var(--muted); border:1px solid var(--line);
}
.pri.p0{color:var(--crit); border-color:var(--crit); background:color-mix(in oklch,var(--crit) 9%,var(--panel))}
.pri.p1{color:var(--warn); border-color:var(--warn); background:color-mix(in oklch,var(--warn) 9%,var(--panel))}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px}
.dot.ok{background:var(--ok)} .dot.warning{background:var(--warn)} .dot.critical{background:var(--crit)}
.tag{font-size:10px; padding:2px 6px; border-radius:4px; border:1px solid}
.tag.allow{color:var(--ok); border-color:var(--ok); background:color-mix(in oklch,var(--ok) 9%,var(--panel))}
.tag.require_approval{color:var(--warn); border-color:var(--warn); background:color-mix(in oklch,var(--warn) 9%,var(--panel))}
.tag.deny{color:var(--crit); border-color:var(--crit); background:color-mix(in oklch,var(--crit) 9%,var(--panel))}
.wan{font-size:10px; font-family:var(--mono)}
.wan.fiber{color:var(--fiber)} .wan.g5{color:var(--g5)} .wan.satellite{color:var(--sat)}

/* ---------- agent stream ---------- */
#stream{display:flex; flex-direction:column; gap:9px}
.card{
  border:1px solid var(--line); border-left:2px solid var(--accent);
  background:var(--panel-2); border-radius:0 7px 7px 0; padding:9px 12px;
  animation:pop var(--dur-medium,280ms) var(--ease-out,cubic-bezier(.16,1,.3,1));
}
@keyframes pop{from{opacity:0; transform:translateX(-8px)}to{opacity:1}}
.card .hd{display:flex; gap:8px; align-items:baseline; margin-bottom:4px}
.card .who{font-size:11.5px; font-weight:600; color:var(--accent)}
.card .st{font-size:9.5px; color:var(--dim); font-family:var(--mono)}
.card .tx{font-size:12px; line-height:1.55; color:var(--muted)}
.card.sys{border-left-color:var(--warn)} .card.sys .who{color:var(--warn)}
.card.exec{border-left-color:var(--ok)} .card.exec .who{color:var(--ok)}
.card.crit{border-left-color:var(--crit)} .card.crit .who{color:var(--crit)}
.card ul{margin:6px 0 0; padding-left:17px; font-size:11.5px; color:var(--muted); line-height:1.6}
code{font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--bg);
     padding:1px 5px; border-radius:3px}

/* ---------- modal ---------- */
#modal{
  position:fixed; inset:0; background:var(--bg); display:none;
  align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(3px);
}
#modal.show{display:flex}
.dlg{
  width:min(620px,92vw); max-height:86vh; overflow:auto; background:var(--panel);
  border:1px solid var(--warn); border-radius:11px; padding:22px;
  box-shadow:0 24px 70px var(--bg);
}
.dlg h3{margin:0 0 4px; font-size:16px; color:var(--warn)}
.dlg .sub{color:var(--muted); font-size:12px; margin-bottom:16px}
.findings{background:var(--panel-2); border:1px solid var(--warn); border-radius:7px;
          padding:11px 13px; margin-bottom:14px}
.findings li{font-size:12px; line-height:1.65; color:var(--warn)}
.acts{background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
      padding:11px 13px; margin-bottom:18px}
.acts li{font-size:12px; line-height:1.7; color:var(--muted)}
.dlg ul{margin:0; padding-left:18px}
.btns{display:flex; gap:10px; justify-content:flex-end}
.empty{color:var(--dim); font-size:12px; padding:14px 2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Workbench redesign ---------- */
:root{
  --bg:oklch(13% 0.012 235); --panel:oklch(16% 0.014 235);
  --panel-2:oklch(19% 0.016 235); --panel-3:oklch(22% 0.018 235);
  --line:oklch(29% 0.018 235); --line-strong:oklch(38% 0.025 235);
  --fg:oklch(94% 0.008 235); --muted:oklch(76% 0.018 235);
  --dim:oklch(58% 0.025 235); --ok:oklch(78% 0.17 150);
  --warn:oklch(82% 0.15 78); --crit:oklch(70% 0.19 28);
  --accent:oklch(78% 0.13 210); --fiber:var(--ok);
  --g5:var(--warn); --sat:oklch(74% 0.13 250); --wire:var(--line-strong);
  --scrim:oklch(8% 0.01 235 / .84); --shadow:oklch(5% 0.02 235 / .42);
  --ambient:oklch(23% .035 220 / .34); --header-surface:oklch(14.5% .014 235 / .96);
  --accent-ink:oklch(18% .025 235); --positive-ink:oklch(18% .035 150);
  --dc-surface:oklch(21% .034 220);
  --space-3xs:.25rem; --space-2xs:.5rem; --space-xs:.75rem; --space-sm:1rem;
  --space-md:1.5rem; --space-lg:2rem; --space-xl:3rem;
  --font-display:"Geist","Noto Sans TC","PingFang TC",sans-serif;
  --font-body:"IBM Plex Sans","Noto Sans TC","PingFang TC",sans-serif;
  --mono:"Geist Mono","SFMono-Regular",Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --dur-short:160ms; --dur-medium:280ms;
}
html,body{min-width:0; height:100%; overflow-x:clip}
body{
  min-height:100dvh; font-family:var(--font-body); font-size:15px;
  background:var(--bg); color:var(--fg); text-rendering:optimizeLegibility;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:radial-gradient(circle at 14% 0%,var(--ambient),transparent 31%);
}
.visually-hidden{
  position:absolute!important; width:1px!important; height:1px!important; padding:0!important;
  margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important;
  white-space:nowrap!important; border:0!important;
}
header{
  min-height:68px; padding:var(--space-2xs) var(--space-md); gap:var(--space-xs);
  border-bottom:1px solid var(--line); background:var(--header-surface);
  box-shadow:0 12px 36px var(--shadow); position:relative; z-index:10;
}
.brand{font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:-.025em; white-space:nowrap}
.brand small{display:block; margin:var(--space-3xs) 0 0; font-family:var(--font-body); font-size:11px; font-weight:400; color:var(--dim); letter-spacing:.02em}
.badge{
  min-height:34px; display:inline-flex; align-items:center; gap:var(--space-2xs); padding:var(--space-2xs) var(--space-xs);
  border-radius:var(--radius-control,10px); background:var(--panel); font-family:var(--mono);
  font-size:10px; letter-spacing:.01em;
}
.badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px color-mix(in oklch,currentColor 14%,transparent)}
.badge.on{color:var(--ok); border-color:color-mix(in oklch,var(--ok) 38%,var(--line))}
.badge.off{color:var(--warn); border-color:color-mix(in oklch,var(--warn) 36%,var(--line))}
.control-group{display:flex; align-items:center; gap:var(--space-2xs)}
select,button{
  min-height:44px; border-radius:10px; border-color:var(--line); background:var(--panel-2);
  color:var(--fg); transition:background-color var(--dur-short) var(--ease-out),
    border-color var(--dur-short) var(--ease-out),transform 100ms var(--ease-out);
}
select{max-width:370px; padding-inline:var(--space-xs) calc(var(--space-md) + var(--space-xs)); color-scheme:dark}
button{font-family:var(--font-display); font-weight:650; white-space:nowrap}
button:hover:not(:disabled){background:var(--panel-3); border-color:var(--line-strong)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); padding-inline:var(--space-sm)}
button.primary:hover:not(:disabled){background:color-mix(in oklch,var(--accent) 88%,var(--fg)); border-color:var(--accent)}
button.go{background:var(--ok); color:var(--positive-ink); border-color:var(--ok)}
button.no{background:transparent; color:var(--crit); border-color:color-mix(in oklch,var(--crit) 60%,var(--line))}

main{
  padding:var(--space-xs); grid-template-columns:minmax(0,1.7fr) minmax(390px,.82fr); gap:var(--space-xs);
  background:transparent; min-height:0;
}
.col{gap:var(--space-xs); background:transparent}
.panel{
  position:relative; padding:var(--space-sm); background:var(--panel); border:1px solid var(--line);
  border-radius:14px; box-shadow:0 14px 40px var(--shadow); scrollbar-gutter:stable;
}
.col:first-child .panel:first-child{flex:0 0 52%}
.col:last-child .panel:first-child{flex:0 0 auto}
h2{
  display:flex; align-items:center; justify-content:space-between; gap:var(--space-sm); margin:0 0 var(--space-xs);
  font-family:var(--font-display); font-size:12px; font-weight:700; letter-spacing:.075em;
  color:var(--muted); line-height:1.3;
}
h2 .hint{float:none; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:10px; color:var(--dim)}
#topo{min-height:290px; max-height:calc(52dvh - 88px)}
.nodebox{fill:var(--panel-2); stroke:var(--line-strong); rx:9}
.nodebox.dc{fill:var(--dc-surface); stroke:color-mix(in oklch,var(--accent) 42%,var(--line))}
.nodelbl{font-family:var(--font-body); font-size:11px; font-weight:650}
.nodesub,.linklbl{font-family:var(--mono); fill:var(--dim)}
.link{stroke-width:2.25}

.tiles{grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2xs); margin-bottom:var(--space-sm)}
.tile{min-width:0; min-height:100px; padding:var(--space-xs); border-radius:12px; background:var(--panel-2); border-color:var(--line)}
.tile:first-child{grid-column:1 / -1; min-height:128px; background:linear-gradient(135deg,color-mix(in oklch,var(--ok) 10%,var(--panel-2)),var(--panel-2))}
.tile .k{font-size:11px; color:var(--muted); letter-spacing:.03em}
.tile .v{font-size:clamp(27px,2.4vw,42px); letter-spacing:-.045em; margin-top:var(--space-2xs)}
.tile:first-child .v{font-size:clamp(40px,4vw,62px)}
.tile .d{margin-top:var(--space-3xs); font-size:10px; color:var(--dim)}

table{font-size:12px}
th{padding:8px 8px; background:var(--panel); color:var(--dim); border-bottom-color:var(--line); letter-spacing:.04em}
td{padding:9px 8px; border-bottom-color:color-mix(in oklch,var(--line) 64%,transparent)}
tbody tr{transition:background-color var(--dur-short) var(--ease-out)}
tbody tr:hover td{background:color-mix(in oklch,var(--panel-3) 72%,transparent)}
tr.sel td{background:color-mix(in oklch,var(--accent) 9%,var(--panel))}
.pri{border-radius:5px; background:var(--panel-2)}
.dot{width:7px; height:7px; margin-inline-end:6px}
.tag{display:inline-flex; align-items:center; min-height:24px; padding:3px 7px; border-radius:6px; white-space:nowrap}
.tag.allow{background:color-mix(in oklch,var(--ok) 9%,var(--panel)); border-color:color-mix(in oklch,var(--ok) 35%,var(--line))}
.tag.require_approval{background:color-mix(in oklch,var(--warn) 9%,var(--panel)); border-color:color-mix(in oklch,var(--warn) 35%,var(--line))}
.tag.deny{background:color-mix(in oklch,var(--crit) 9%,var(--panel)); border-color:color-mix(in oklch,var(--crit) 35%,var(--line))}

#stream{gap:var(--space-2xs); padding-inline-start:var(--space-sm); position:relative}
#stream::before{content:""; position:absolute; inset-block:4px; inset-inline-start:4px; width:1px; background:var(--line)}
.card{
  position:relative; padding:var(--space-xs); border:1px solid var(--line); border-inline-start:1px solid var(--line);
  border-radius:10px; background:var(--panel-2); animation:event-in var(--dur-medium) var(--ease-out);
}
.card::before{content:""; position:absolute; width:9px; height:9px; border-radius:50%; inset-inline-start:-19px; inset-block-start:15px; background:var(--accent); box-shadow:0 0 0 4px var(--panel)}
@keyframes event-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .hd{align-items:center; margin-bottom:var(--space-3xs)}
.card .who{font-family:var(--font-display); font-size:12px; font-weight:700}
.card .st{margin-inline-start:auto; font-size:10px}
.card .tx{font-size:13px; line-height:1.6; color:var(--muted)}
.card.sys::before{background:var(--warn)} .card.exec::before{background:var(--ok)} .card.crit::before{background:var(--crit)}
/* Agent 已開跑、LLM 敘述還沒回來的暫時卡片，之後被真正的結果取代 */
.card.pending{border-style:dashed; background:transparent}
.card.pending .who,.card.pending .tx{color:var(--dim)}
.card.pending::before{background:var(--dim); animation:pending-pulse 1.4s ease-in-out infinite}
@keyframes pending-pulse{50%{opacity:.3}}
.empty{display:grid; place-items:center; min-height:92px; padding:var(--space-sm); border:1px dashed var(--line); border-radius:10px; color:var(--dim); text-align:center}
code{font-size:11px; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:5px}

#modal{
  position:fixed; inset:0; margin:auto; width:min(640px,calc(100% - 28px)); max-height:min(86dvh,760px);
  padding:0; border:1px solid color-mix(in oklch,var(--warn) 48%,var(--line)); border-radius:18px;
  background:var(--panel); color:var(--fg); box-shadow:0 28px 90px var(--shadow);
}
#modal::backdrop{background:var(--scrim); backdrop-filter:blur(8px)}
#modal[open]{display:block; animation:dialog-in var(--dur-medium) var(--ease-out)}
@keyframes dialog-in{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
.dlg{width:auto; max-height:none; overflow:auto; padding:var(--space-md); border:0; border-radius:inherit; background:transparent; box-shadow:none}
.dlg h3{font-family:var(--font-display); font-size:20px; color:var(--fg); letter-spacing:-.02em}
.dlg .sub{font-size:13px; line-height:1.55; margin:var(--space-2xs) 0 var(--space-sm)}
.findings,.acts{padding:var(--space-xs) var(--space-sm); border-radius:10px}
.findings{background:color-mix(in oklch,var(--warn) 8%,var(--panel)); border-color:color-mix(in oklch,var(--warn) 32%,var(--line))}
.acts{background:var(--panel-2)}
.findings li,.acts li{font-size:13px}
.btns{margin-top:var(--space-md)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;background-clip:padding-box}

@media (max-width:64rem){
  body{height:auto; min-height:100dvh; overflow:auto}
  header{flex-wrap:wrap; align-items:center}
  .brand{flex:1 1 auto}.spacer{display:none}
  .control-group{width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto}
  .control-group select{max-width:none; width:100%}
  main{display:grid; grid-template-columns:minmax(0,1fr); overflow:visible}
  .col{min-height:auto}.panel{overflow:auto}
  .col:first-child .panel:first-child,.col:last-child .panel:first-child{flex-basis:auto}
  #topo{min-width:720px; max-height:none}
}
@media (max-width:40rem){
  header{padding:var(--space-xs)}.brand{font-size:17px}.brand small{font-size:10px}
  .badge{order:3; width:100%; justify-content:center}
  .control-group{order:4; grid-template-columns:minmax(0,1fr)}
  .control-group button{width:100%}
  main{padding:var(--space-2xs); gap:var(--space-2xs)}.col{gap:var(--space-2xs)}
  .panel{padding:var(--space-xs); border-radius:12px}
  h2{align-items:flex-start; flex-direction:column; gap:var(--space-3xs)}
  h2 .hint{width:100%}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile:first-child{grid-column:auto}
  .tile,.tile:first-child{min-height:104px}
  #svcTable,#plans table{min-width:620px}
  .btns{display:grid; grid-template-columns:minmax(0,1fr)}
  .btns button{width:100%}
}
@media (pointer:coarse){select,button{min-height:48px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #modal[open]{animation:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">AegisMesh 天穹韌網<small>通訊韌性數位孿生 · 戰情室</small></div>
  <div class="spacer"></div>
  <span class="badge" id="llmBadge" role="status" aria-live="polite">推理引擎檢查中…</span>
  <div class="control-group">
    <label class="visually-hidden" for="scenario">災害情境</label>
    <select id="scenario" aria-label="災害情境" disabled></select>
    <button class="primary" id="runBtn" type="button" disabled>載入中…</button>
  </div>
</header>

<main>
  <div class="col">
    <div class="panel">
      <h2>網路拓樸 · 智慧醫院園區<span class="hint" id="topoHint" role="status">基準狀態</span></h2>
      <svg id="topo" viewBox="0 0 900 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="智慧醫院園區網路拓樸"></svg>
    </div>
    <div class="panel" style="flex:1">
      <h2>Agent 決策軌跡<span class="hint">Observe → Plan → Simulate → Approve → Execute → Verify</span></h2>
      <div id="stream" aria-live="polite" aria-relevant="additions"><div class="empty">選擇災害情境後按「執行閉環」。</div></div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>即時指標<span class="hint" id="phase" role="status" aria-live="polite">待命</span></h2>
      <div class="tiles">
        <div class="tile"><div class="k">關鍵可用率</div>
          <div class="v num" id="mCrit">-</div><div class="d" id="dCrit">&nbsp;</div></div>
        <div class="tile"><div class="k">SLA 達成率</div>
          <div class="v num" id="mSlo">-</div><div class="d" id="dSlo">&nbsp;</div></div>
        <div class="tile"><div class="k">月度成本</div>
          <div class="v num" id="mCost">-</div><div class="d" id="dCost">&nbsp;</div></div>
      </div>
      <table id="svcTable">
        <thead><tr><th>優先</th><th>業務</th><th>路徑</th>
          <th class="r">頻寬</th><th class="r">延遲</th><th>SLA</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel" style="flex:1">
      <h2>候選計畫 · 孿生推演與政策裁決</h2>
      <div id="plans" aria-live="polite"><div class="empty">尚未產生候選計畫。</div></div>
    </div>
  </div>
</main>

<dialog id="modal" aria-labelledby="approvalTitle" aria-describedby="mSub">
<div class="dlg">
  <h3 id="approvalTitle">需要人工核准</h3>
  <div class="sub" id="mSub"></div>
  <div class="findings"><ul id="mFind"></ul></div>
  <div class="acts"><ul id="mActs"></ul></div>
  <div class="btns">
    <button class="no" id="rejectBtn">拒絕執行</button>
    <button class="go" id="approveBtn">核准並執行</button>
  </div>
</div></dialog>

<script>
const $ = s => document.querySelector(s);
const SVG = 'http://www.w3.org/2000/svg';
const WAN = {fiber:'fiber', '5g':'g5', satellite:'sat'};
const KIND_LABEL = {fiber:'固網', '5g':'5G', satellite:'衛星'};

let topo = null, ws = null, baseline = null, running = false, ready = false;

// 開場三個 fetch 的上限。沒有這道防線的話，只要伺服器接受了連線卻不回應，
// fetch 會無限期掛著，畫面就永遠停在「載入中…」且沒有任何線索。
const BOOT_TIMEOUT_MS = 8000;

/* ------------------------------------------------------------ 拓樸繪製 */
function drawTopology(t){
  const svg = $('#topo');
  const C = t.canvas;
  svg.setAttribute('viewBox', `0 0 ${C.w} ${C.h}`);
  svg.innerHTML = '';
  const pos = Object.fromEntries(t.nodes.map(n => [n.id, n]));
  const cx = n => n.x + C.node_w / 2, cy = n => n.y + C.node_h / 2;

  const gLinks = document.createElementNS(SVG,'g');
  const gLabels = document.createElementNS(SVG,'g');
  for (const l of t.links){
    const a = pos[l.src], b = pos[l.dst];
    if (!a || !b) continue;
    const line = document.createElementNS(SVG,'line');
    line.setAttribute('x1', cx(a)); line.setAttribute('y1', cy(a));
    line.setAttribute('x2', cx(b)); line.setAttribute('y2', cy(b));
    line.setAttribute('class', 'link ' + (WAN[l.kind] || ''));
    line.dataset.linkId = l.id;
    gLinks.appendChild(line);

    if (WAN[l.kind]){
      const tx = document.createElementNS(SVG,'text');
      tx.setAttribute('x', (cx(a) + cx(b))/2);
      tx.setAttribute('y', (cy(a) + cy(b))/2 - 6);
      tx.setAttribute('text-anchor','middle');
      tx.setAttribute('class','linklbl');
      tx.dataset.labelFor = l.id;
      tx.textContent = `${l.capacity_mbps}M · ${l.base_latency_ms}ms`;
      gLabels.appendChild(tx);
    }
  }
  svg.appendChild(gLinks); svg.appendChild(gLabels);

  const labels = [];
  for (const n of t.nodes){
    const g = document.createElementNS(SVG,'g');
    const r = document.createElementNS(SVG,'rect');
    r.setAttribute('x', n.x); r.setAttribute('y', n.y);
    r.setAttribute('width', C.node_w); r.setAttribute('height', C.node_h);
    r.setAttribute('class', 'nodebox' + (n.kind === 'dc' ? ' dc' : ''));
    r.setAttribute('rx', 6);
    const t1 = document.createElementNS(SVG,'text');
    t1.setAttribute('x', n.x + 9); t1.setAttribute('y', n.y + 15);
    t1.setAttribute('class','nodelbl');
    t1.textContent = n.short || n.name;
    const t2 = document.createElementNS(SVG,'text');
    t2.setAttribute('x', n.x + 9); t2.setAttribute('y', n.y + 27);
    t2.setAttribute('class','nodesub');
    t2.textContent = n.id;
    g.append(r, t1, t2); svg.appendChild(g);
    labels.push(t1);
  }

  // 量測後才決定要不要壓縮：文字放得下就用自然字距，放不下才夾寬度。
  // 無條件套 textLength 會把短名稱硬拉開，各節點字距不一致很難看。
  const maxW = C.node_w - 18;
  for (const t1 of labels){
    if (t1.getComputedTextLength() > maxW){
      t1.setAttribute('textLength', maxW);
      t1.setAttribute('lengthAdjust','spacingAndGlyphs');
    }
  }
}

function paintLinks(snapshot){
  for (const [lid, ls] of Object.entries(snapshot.links)){
    const line = document.querySelector(`line[data-link-id="${lid}"]`);
    if (!line) continue;
    const base = line.getAttribute('class').split(' ').filter(c => !['degraded','down'].includes(c));
    if (ls.state === 'down')        base.push('down');
    else if (ls.state === 'degraded') base.push('degraded');
    line.setAttribute('class', base.join(' '));
    // 線寬隨使用率成長，讓壅塞在畫面上「看得見」
    line.style.strokeWidth = (1.6 + Math.min(ls.utilization_pct, 100) / 100 * 4).toFixed(1);

    const lbl = document.querySelector(`text[data-label-for="${lid}"]`);
    if (lbl){
      lbl.textContent = ls.state === 'down'
        ? '中斷'
        : `${ls.utilization_pct.toFixed(0)}% · ${ls.latency_ms.toFixed(0)}ms`;
      lbl.style.fill = ls.state === 'down' ? 'var(--crit)'
        : ls.utilization_pct > 75 ? 'var(--warn)' : '';
    }
  }
}

/* ------------------------------------------------------------ 指標與業務表 */
function tone(pct){ return pct >= 99.9 ? 'ok' : pct >= 50 ? 'warn' : 'crit'; }

function renderSnapshot(snap, phase){
  $('#phase').textContent = phase;
  $('#topoHint').textContent = phase;
  paintLinks(snap);

  const set = (id, val, cls, delta) => {
    const el = $(id); el.textContent = val; el.className = 'v num ' + (cls || '');
    if (delta !== undefined) $(id.replace('#m','#d')).textContent = delta;
  };
  const c = snap.critical_availability_pct, s = snap.slo_compliance_pct;
  set('#mCrit', c.toFixed(0) + '%', tone(c),
      baseline ? `基準 ${baseline.critical_availability_pct.toFixed(0)}%` : ' ');
  set('#mSlo', s.toFixed(0) + '%', tone(s),
      baseline ? `基準 ${baseline.slo_compliance_pct.toFixed(0)}%` : ' ');
  const cost = snap.monthly_cost_ntd;
  set('#mCost', 'NT$' + (cost/1000).toFixed(0) + 'k', '',
      baseline ? `基準 NT$${(baseline.monthly_cost_ntd/1000).toFixed(0)}k` : ' ');

  const svcMeta = Object.fromEntries(topo.services.map(x => [x.id, x]));
  const linkKind = Object.fromEntries(topo.links.map(l => [l.id, l.kind]));
  const rows = Object.entries(snap.services)
    .sort((a,b) => svcMeta[a[0]].priority - svcMeta[b[0]].priority)
    .map(([sid, st]) => {
      const m = svcMeta[sid];
      const wan = findWan(sid, snap, linkKind);
      return `<tr>
        <td><span class="pri p${m.priority}">P${m.priority}</span></td>
        <td>${m.name}</td>
        <td><span class="wan ${wan === '5g' ? 'g5' : (wan || '')}">${
          wan ? KIND_LABEL[wan] : '-'}</span></td>
        <td class="r">${st.admitted_mbps.toFixed(0)}M</td>
        <td class="r">${st.latency_ms === null ? '-' : st.latency_ms.toFixed(0) + 'ms'}</td>
        <td><span class="dot ${st.health}"></span>${st.slo_met ? '達標' : '違反'}</td>
      </tr>`;
    }).join('');
  $('#svcTable tbody').innerHTML = rows;
}

function findWan(sid, snap, linkKind){
  // 業務實際走了哪些鏈路由後端提供（link_ids），前端不自行推導路徑
  for (const lid of (snap.services[sid].link_ids || [])){
    if (WAN[linkKind[lid]]) return linkKind[lid];
  }
  return null;
}

/* ------------------------------------------------------------ 事件串流 */
function card(who, stage, text, cls, extra){
  const el = document.createElement('div');
  el.className = 'card' + (cls ? ' ' + cls : '');
  el.innerHTML = `<div class="hd"><span class="who">${who}</span>
    <span class="st">${stage || ''}</span></div>
    <div class="tx">${text}</div>${extra || ''}`;
  const s = $('#stream');
  if (s.querySelector('.empty')) s.innerHTML = '';
  s.appendChild(el);
  s.scrollTop = s.scrollHeight;
}

// Agent 的敘述要等一次 LLM 往返才回來。先放一張佔位卡片，
// 收到 'agent' 時再換成真正的結果，中間才不會是一片空白。
function pending(who, stage){
  clearPending();
  card(who, stage, '推理中…', 'pending');
}

function clearPending(){
  const el = $('#stream .card.pending');
  if (el) el.remove();
}

function renderPlans(plans, selectedId){
  $('#plans').innerHTML = `<table>
    <thead><tr><th>策略</th><th class="r">關鍵</th><th class="r">SLA</th>
      <th class="r">月成本</th><th class="r">評分</th><th>裁決</th></tr></thead>
    <tbody>${plans.map(p => `
      <tr class="${p.id === selectedId ? 'sel' : ''}">
        <td>${p.id === selectedId ? '<span class="visually-hidden">首選：</span>' : ''}${p.strategy}</td>
        <td class="r">${p.projected ? p.projected.critical_availability_pct.toFixed(0)+'%' : '-'}</td>
        <td class="r">${p.projected ? p.projected.slo_compliance_pct.toFixed(0)+'%' : '-'}</td>
        <td class="r">NT$${p.projected ? (p.projected.monthly_cost_ntd/1000).toFixed(0)+'k' : '-'}</td>
        <td class="r">${p.score.toFixed(1)}</td>
        <td><span class="tag ${p.policy_decision}">${
          {allow:'自動放行', require_approval:'需核准', deny:'拒絕'}[p.policy_decision] || p.policy_decision
        }</span></td>
      </tr>`).join('')}</tbody></table>`;
}

/* ------------------------------------------------------------ WebSocket */
function handle(m){
  switch (m.kind){
    case 'started':
      card('災害注入', m.scenario.id, m.scenario.narrative, 'crit',
        '<ul>' + m.faults.map(f =>
          `<li>${f.description}<br><code>$ ${f.netem}</code></li>`).join('') + '</ul>');
      break;
    case 'baseline':
      baseline = m.snapshot; renderSnapshot(m.snapshot, '事故前基準'); break;
    case 'incident':
      renderSnapshot(m.snapshot, '事故當下'); break;
    case 'agent_start':
      pending(m.agent, m.stage); break;
    case 'agent':
      clearPending();
      card(m.agent.agent, m.agent.stage, m.agent.narrative || '（無敘述）'); break;
    case 'plans':
      renderPlans(m.plans, m.selected); break;
    case 'approval_request':
      showModal(m.plan); break;
    case 'approval':
      if (!m.human_gate) card('政策引擎', 'approve', '未觸發任何治理規則，自動放行。', 'exec');
      else if (!m.approved) card('人工核准', 'approve', '已拒絕執行，網路維持事故當下狀態。', 'crit');
      break;
    case 'execute':
      card('Orchestrator', 'execute', `已套用 ${m.applied.length} 個變更動作：`, 'exec',
        '<ul>' + m.applied.map(a => `<li>${a}</li>`).join('') + '</ul>');
      break;
    case 'replan':
      card('Orchestrator', 'replan', `驗證未通過，啟動第 ${m.round + 1} 輪重規劃。`, 'sys'); break;
    case 'replan_exhausted':
      card('Orchestrator', 'replan', `連續 ${m.rounds} 輪未能恢復，升級人工處理。`, 'crit'); break;
    case 'finished':
      renderSnapshot(m.final, m.summary.succeeded ? '已復原' : '未復原');
      finish(m); break;
    case 'error':
      clearPending();
      card('系統', 'error', m.message, 'crit'); break;
  }
}

function finish(m){
  clearPending();
  const s = m.summary, ca = s.critical_availability_pct, sc = s.slo_compliance_pct;
  const row = (k, v, suf) =>
    `<tr><td>${k}</td><td class="r">${v.baseline}${suf}</td>
     <td class="r" style="color:var(--crit)">${v.incident}${suf}</td>
     <td class="r" style="color:var(--ok);font-weight:600">${v.final}${suf}</td></tr>`;
  card(s.succeeded ? '閉環完成' : '閉環未達標', `${s.rounds} 輪`,
    `${s.succeeded ? '生命關鍵業務已全數恢復。' : (s.halted_reason || '仍有關鍵業務未恢復。')}`,
    s.succeeded ? 'exec' : 'crit',
    `<table style="margin-top:9px">
       <thead><tr><th>指標</th><th class="r">事故前</th><th class="r">事故當下</th>
         <th class="r">復原後</th></tr></thead>
       <tbody>${row('關鍵業務可用率', ca, '%')}${row('SLA 達成率', sc, '%')}</tbody></table>
     <div style="margin-top:9px;font-size:11px;color:var(--dim)">
       稽核軌跡 ${m.audit.entries} 筆 · 雜湊鏈${m.audit.verified ? '完整' : '異常'}
       · <code>${m.audit.path.split('/').pop()}</code></div>`);
  running = false; $('#runBtn').disabled = false; $('#runBtn').textContent = '再跑一次';
  $('#runBtn').removeAttribute('aria-busy');
  $('#scenario').disabled = false;
}

function showModal(plan){
  $('#mSub').innerHTML =
    `計畫 <b>${plan.strategy}</b> · 風險評分 <b class="num">${plan.risk_score}</b>/100 ·
     推演後關鍵可用率 <b class="num">${plan.projected.critical_availability_pct}%</b>`;
  $('#mFind').innerHTML = plan.policy_findings.map(f => `<li>${f}</li>`).join('')
    || '<li>（無政策發現）</li>';
  $('#mActs').innerHTML = plan.actions.map(a => `<li>${a}</li>`).join('');
  const dialog = $('#modal');
  if (!dialog.open) dialog.showModal();
  $('#rejectBtn').focus();
}

function respond(approved){
  if ($('#modal').open) $('#modal').close();
  ws && ws.send(JSON.stringify({action:'approve', approved}));
  card('人工核准', 'approve', approved ? '值班主管已核准執行。' : '值班主管拒絕執行。',
       approved ? 'exec' : 'crit');
}

$('#approveBtn').onclick = () => respond(true);
$('#rejectBtn').onclick  = () => respond(false);
$('#modal').addEventListener('cancel', e => e.preventDefault());

$('#runBtn').onclick = () => {
  if (!ready) return boot();   // 開場載入失敗時，同一顆按鈕就是「重試載入」
  if (running) return;
  running = true;
  $('#runBtn').disabled = true; $('#runBtn').textContent = '執行中…';
  $('#runBtn').setAttribute('aria-busy','true');
  $('#scenario').disabled = true;
  $('#stream').innerHTML = '';
  $('#plans').innerHTML = '<div class="empty">最佳化器計算中…</div>';

  const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${wsProtocol}://${location.host}/ws/demo`);
  ws.onopen = () => ws.send(JSON.stringify({action:'run', scenario:$('#scenario').value}));
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onerror = () => card('系統', 'ws', 'WebSocket 連線錯誤。', 'crit');
  ws.onclose = () => {
    if (running){
      clearPending();
      card('系統', 'ws', '連線中斷，閉環已停止。', 'crit');
      running = false; $('#runBtn').disabled = false; $('#scenario').disabled = false;
      $('#runBtn').removeAttribute('aria-busy');
    }
  };
};

/* ------------------------------------------------------------ 啟動 */
async function boot(){
  ready = false;
  $('#runBtn').disabled = true;
  $('#runBtn').textContent = '載入中…';
  $('#llmBadge').textContent = '推理引擎檢查中…';
  $('#llmBadge').className = 'badge';

  const get = async path => {
    const r = await fetch(path, {signal: AbortSignal.timeout(BOOT_TIMEOUT_MS)});
    if (!r.ok) throw new Error(`${path} 回應 HTTP ${r.status}`);
    return r.json();
  };

  try {
    const [t, scs, h] = await Promise.all([
      get('/api/topology'), get('/api/scenarios'), get('/api/health'),
    ]);
    topo = t;
    drawTopology(t);
    baseline = t.baseline;
    renderSnapshot(t.baseline, '事故前基準');

    $('#scenario').innerHTML = scs.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    const b = $('#llmBadge');
    b.textContent = h.llm_online ? `LLM ${h.llm_mode}` : '離線決定性推理（未設金鑰）';
    b.className = 'badge ' + (h.llm_online ? 'on' : 'off');
    $('#stream').innerHTML = '<div class="empty">選擇災害情境後按「執行閉環」。</div>';
    $('#scenario').disabled = false;
    ready = true;
    $('#runBtn').disabled = false;
    $('#runBtn').textContent = '執行閉環';
  } catch (error) {
    // 失敗時務必把按鈕交還給使用者。早期版本只改了徽章，按鈕就永遠停在
    // disabled 的「載入中…」—— 伺服器還沒起來就開頁面（啟動約需 0.9s）
    // 是最容易踩到的情況，而畫面看起來只是「載入很久」，沒有重試的路。
    const timedOut = error.name === 'TimeoutError';
    $('#llmBadge').textContent = timedOut ? '戰情室資料逾時' : '戰情室資料載入失敗';
    $('#llmBadge').className = 'badge off';
    $('#stream').innerHTML = '<div class="empty">無法載入戰情室資料。' +
      '請確認 <code>aegismesh serve</code> 已啟動，再按上方「重試載入」。</div>';
    $('#runBtn').disabled = false;
    $('#runBtn').textContent = '重試載入';
    console.error('Dashboard initialization failed', error);
  }
}

boot();
</script>
</body>
</html>
