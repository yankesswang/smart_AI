[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-guardian"
version = "0.1.0"
description = "Factory Guardian AI — Agentic AI 智慧工廠自主營運與風險管理平台（競賽 MVP）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "openai>=1.30",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
factory-guardian = "factory_guardian.cli:main"

[tool.setuptools.packages.find]
include = ["factory_guardian*"]

[tool.setuptools.package-data]
"factory_guardian.api" = ["static/*"]
"factory_guardian.knowledge" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
