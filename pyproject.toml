[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-guardian"
version = "0.1.0"
description = "Factory Guardian AI — Agentic AI 智慧工廠自主營運與風險管理平台（競賽 MVP）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "openai>=1.30",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# 聲音模態（factory_guardian/acoustics/）。刻意留在 optional：
# Agent 閉環、Simulator API 與 Dashboard 都不需要它，沒安裝也跑得完整個 Demo；
# tests/test_acoustics.py 會在缺件時 skip，CI 不會因此變紅。
acoustics = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
]

[project.scripts]
factory-guardian = "factory_guardian.cli:main"
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
include = ["factory_guardian*", "agentgate*"]

[tool.setuptools.package-data]
"factory_guardian.api" = ["static/*"]
"factory_guardian.knowledge" = ["data/*"]
"agentgate.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
